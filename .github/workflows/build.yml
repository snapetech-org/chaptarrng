name: Build ChaptarrNG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
    secrets:
      SIXLABORS_LICENSE_KEY:
        required: true
  workflow_dispatch:

# Tests only, never publishes. PRs and merges are both validated automatically, but
# nothing reaches users until release.yml is run by hand; docker-publish.yml is
# workflow_call-only, so no run started here can push an image.

# One live run per PR and per branch: a newer push supersedes the older run, so a
# batch of merges costs one build of the combined result rather than one each.
# Release-called runs are never cancelled - that would silently drop the gate.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  release-notes:
    name: Release-note contract
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.10.0
        package-manager-cache: false

    - name: Validate release-note fragment or explicit opt-out
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BODY: ${{ github.event.pull_request.body }}
      shell: bash
      run: |
        set -euo pipefail
        body_file="$RUNNER_TEMP/pr-body.md"
        printf '%s' "$PR_BODY" > "$body_file"
        node scripts/check-release-notes.mjs \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" \
          --pr-body "$body_file" \
          --summary-file "$GITHUB_STEP_SUMMARY"
        node scripts/preview-release-notes.mjs \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    # Only validated main-branch code can use the local runner; PRs and other matrix legs stay hosted.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && fromJSON('["self-hosted","Linux","X64","host"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: osx

    steps:
    - name: Configure private runner temporary storage
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail

        if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* || ! -d "$RUNNER_TEMP" || ! -r "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" || ! -x "$RUNNER_TEMP" ]]; then
          printf 'RUNNER_TEMP must be an absolute, readable, writable directory without line breaks\n' >&2
          exit 1
        fi

        runner_temp_resolved="$(cd -- "$RUNNER_TEMP" && pwd -P)"
        if [[ "$runner_temp_resolved" == *$'\n'* || "$runner_temp_resolved" == *$'\r'* ]]; then
          printf 'RUNNER_TEMP must not resolve to a path containing line breaks\n' >&2
          exit 1
        fi
        case "$runner_temp_resolved" in
          /|/tmp|/tmp/*|/var/tmp|/var/tmp/*|/dev/shm|/dev/shm/*)
            printf 'RUNNER_TEMP must not resolve to a shared or root temporary directory\n' >&2
            exit 1
            ;;
        esac

        if [[ ! -O "$runner_temp_resolved" ]]; then
          printf 'RUNNER_TEMP must be owned by the workflow runner user\n' >&2
          exit 1
        fi
        runner_temp_mode="$(stat -c '%a' -- "$runner_temp_resolved")"
        if [[ ! "$runner_temp_mode" =~ ^[0-7]{3,4}$ ]]; then
          printf 'Could not determine RUNNER_TEMP directory permissions\n' >&2
          exit 1
        fi
        runner_temp_permissions=$((8#$runner_temp_mode))
        if (( runner_temp_permissions & 0022 )); then
          printf 'RUNNER_TEMP must not be writable by group or other users\n' >&2
          exit 1
        fi

        : "${GITHUB_ENV:?GITHUB_ENV is required}"
        umask 077
        job_temp="$(mktemp -d -- "$runner_temp_resolved/chaptarrng-job.XXXXXX")"
        mkdir -m 700 -- "$job_temp/dotnet"
        printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\nDOTNET_INSTALL_DIR=%s/dotnet\n' \
          "$job_temp" "$job_temp" "$job_temp" "$job_temp" >> "$GITHUB_ENV"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0

    - name: Require ImageSharp build license
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      shell: bash
      run: |
        if [[ -z "${SIXLABORS_LICENSE_KEY:-}" ]]; then
          echo "::error::Configure the SIXLABORS_LICENSE_KEY Actions secret to build this repository's direct ImageSharp dependency."
          exit 1
        fi

    - name: Guard (repo) - no merge-conflict markers
      shell: bash
      run: |
        if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
          echo "Merge-conflict markers found in tracked files."
          exit 1
        fi
        python -c "import json; json.load(open('package.json', encoding='utf-8'))"

    - name: Guard (version) - package.json and Directory.Build.props in sync
      shell: bash
      run: python3 build-tools/version_guard.py sync

    - name: Guard (version) - no decreases on main
      if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          COMPARE_REF="origin/main"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              COMPARE_REF="HEAD^"
              echo "No ChaptarrNG release tag exists yet; comparing against the parent commit for the initial fork release."
            else
              echo "No reachable version tag or parent commit is available for monotonic version comparison."
              exit 1
            fi
          fi
        fi

        python3 build-tools/version_guard.py monotonic \
          --compare-ref "$COMPARE_REF" \
          --event-path "$GITHUB_EVENT_PATH"

    - name: Guard (version) - version-only commits stay pure
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          COMPARE_REF="origin/${{ github.base_ref }}"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              COMPARE_REF="HEAD^"
              echo "No ChaptarrNG release tag exists yet; checking version-only commit hygiene from the parent commit."
            else
              echo "No reachable version tag or parent commit is available for version-only commit hygiene."
              exit 1
            fi
          fi
        fi

        python3 build-tools/version_guard.py commit-hygiene --compare-ref "$COMPARE_REF"

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.10.0

    - name: Install Yarn
      run: npm install --global yarn@1.22.22

    - name: Install frontend dependencies
      run: yarn install --frozen-lockfile

    - name: Check React Router context
      run: yarn check-react-router-context

    - name: Type-check frontend
      run: yarn typecheck

    - name: Build frontend
      run: yarn build
    
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.401

    - name: Cache NuGet packages
      if: runner.os == 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('src/NuGet.config', 'src/Directory.Packages.props', 'src/Directory.Build.props', 'src/Directory.Build.targets', 'src/Targets/**/*.targets', 'src/Chaptarr.NoTests.sln', 'src/**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-nuget-
    
    # FFmpeg is intentionally not downloaded in this compile/test workflow.
    # Source builds resolve bundled tools first and then the system PATH; explicit
    # native packaging owns bundled-tool acquisition and validation.

    - name: Restore dependencies
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: |
        dotnet restore src/Chaptarr.NoTests.sln
        dotnet restore src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj
    
    - name: Build
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore

    - name: Build test assembly
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: dotnet build src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release --no-restore -p:UseSharedCompilation=false

    - name: Install Chromium for direct-download browser tests
      if: runner.os == 'Linux'
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      run: |
        echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
        pwsh ./_tests/net10.0/playwright.ps1 install --with-deps chromium
    
    - name: Test
      id: validation
      env:
        DIRECT_DOWNLOAD_REQUIRE_PLAYWRIGHT: ${{ runner.os == 'Linux' && 'true' || 'false' }}
        VALIDATION_NODE_ID: chaptarr-${{ matrix.platform }}-${{ runner.arch }}
        VALIDATION_RECEIPT_EXPORT: ${{ runner.temp }}/chaptarr-validation/receipt.json
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/chaptarr-validation"
        echo "started=true" >> "$GITHUB_OUTPUT"
        set +e
        node scripts/validation-engine/engine.mjs --tests-only
        status=$?
        set -e
        exit "$status"

    - name: Upload validation receipt
      if: always() && steps.validation.outputs.started == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: chaptarr-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}-${{ runner.arch }}
        path: ${{ runner.temp }}/chaptarr-validation/receipt.json
        retention-days: 7
        if-no-files-found: error
    
    - name: Publish
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: |
        dotnet publish src/NzbDrone.Console/Chaptarr.Console.csproj -c Release -f net10.0 -o ./publish/Chaptarr
        dotnet publish src/NzbDrone.Update/Chaptarr.Update.csproj -c Release -f net10.0 -o ./publish/Chaptarr/Chaptarr.Update

    - name: Include and verify frontend in artifact
      shell: bash
      run: |
        set -euo pipefail
        test -s ./_output/UI/index.html
        mkdir -p ./publish/Chaptarr/UI
        cp -a ./_output/UI/. ./publish/Chaptarr/UI/
        test -s ./publish/Chaptarr/UI/index.html
    
    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: chaptarrng-${{ matrix.platform }}
        path: ./publish/
        retention-days: 7
        if-no-files-found: error

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chaptarr
          POSTGRES_PASSWORD: chaptarr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chaptarr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Require ImageSharp build license
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      shell: bash
      run: |
        if [[ -z "${SIXLABORS_LICENSE_KEY:-}" ]]; then
          echo "::error::Configure the SIXLABORS_LICENSE_KEY Actions secret to build this repository's direct ImageSharp dependency."
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.10.0
        package-manager-cache: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.401

    - name: Install PostgreSQL client
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Create databases
      shell: bash
      env:
        PGPASSWORD: chaptarr
      run: |
        set -euo pipefail
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-main";'
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-log";'
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-cache";'

    - name: Restore dependencies
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: dotnet restore src/Chaptarr.NoTests.sln

    - name: Build (migrations smoke)
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore

    - name: Smoke - migrate up on fresh PostgreSQL
      id: validation
      env:
        VALIDATION_NODE_ID: chaptarr-postgres-linux-${{ runner.arch }}
        VALIDATION_RECEIPT_EXPORT: ${{ runner.temp }}/chaptarr-validation/receipt.json
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/chaptarr-validation"
        echo "started=true" >> "$GITHUB_OUTPUT"
        set +e
        node scripts/validation-engine/engine.mjs --task postgres-migrations-smoke
        status=$?
        set -e
        exit "$status"

    - name: Upload validation receipt
      if: always() && steps.validation.outputs.started == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: chaptarr-validation-${{ github.run_id }}-${{ github.run_attempt }}-postgres-${{ runner.arch }}
        path: ${{ runner.temp }}/chaptarr-validation/receipt.json
        retention-days: 7
        if-no-files-found: error

  validation-reconcile:
    name: Reconcile native runner receipts
    needs: [build, postgres-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26.10.0
        package-manager-cache: false

    - name: Download receipts from this workflow attempt
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: chaptarr-validation-${{ github.run_id }}-${{ github.run_attempt }}-*
        path: validation-receipts

    - name: Reconcile platform and migration receipts
      env:
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SHA: ${{ github.sha }}
      run: node scripts/validation-engine/reconcile.mjs validation-receipts
