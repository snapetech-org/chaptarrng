# ng-runner-policy: hosted-first-v1
name: Build ChaptarrNG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, edited, reopened, synchronize ]
  workflow_call:
    secrets:
      SIXLABORS_LICENSE_KEY:
        required: true
  workflow_dispatch:

# Tests only, never publishes. PRs and merges are both validated automatically, but
# nothing reaches users until release.yml is run by hand; docker-publish.yml is
# workflow_call-only, so no run started here can push an image.

# Superseded PR code checks cancel; body-only edits have a separate group.
# Main builds and release callers keep their own run and are never superseded.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-notes:
    name: Release-note contract
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot' && (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Validate release-note fragment or explicit opt-out
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BODY: ${{ github.event.pull_request.body }}
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
        if ! git cat-file -e "${HEAD_SHA}^{commit}"; then
          echo "::error::Pull request head ${HEAD_SHA} is unavailable after fetching refs/pull/${PR_NUMBER}/head"
          exit 1
        fi
        body_file="$RUNNER_TEMP/pr-body.md"
        printf '%s' "$PR_BODY" > "$body_file"
        node --test scripts/release-notes.test.mjs
        node scripts/check-release-notes.mjs \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" \
          --pr-body "$body_file" \
          --summary-file "$GITHUB_STEP_SUMMARY"
        node scripts/preview-release-notes.mjs \
          --base "$BASE_SHA" \
          --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    # Trusted main Linux validation uses the isolated shared pool; PRs and
    # non-Linux matrix legs use GitHub-hosted runners.
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && matrix.os == 'ubuntu-latest' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}"]}}', github.run_id)) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-15-intel
            platform: osx

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0

    - name: Test stable GHCR image identity and legacy aliases
      if: matrix.os == 'ubuntu-latest'
      run: |
        bash packaging/scripts/test-publish-image-aliases.sh
        bash packaging/scripts/test-dispatch-ghcr-release-bridge.sh
        bash packaging/scripts/test-release-readiness-gate.sh
        bash packaging/scripts/test-bookshelfng-deb-publish-gate.sh

    - name: Test release publisher configuration preflight
      if: matrix.os == 'ubuntu-latest'
      env:
        TMPDIR: ${{ runner.temp }}
      run: bash packaging/scripts/test-release-publisher-config.sh

    - name: Test Chocolatey legacy package publish gate
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: ./packaging/scripts/test-chocolatey-publish-gate.ps1

    - name: Test hosted runner policy
      if: matrix.os == 'ubuntu-latest'
      run: python3 scripts/test_workflow_runner_policy.py

    - name: Test candidate BookshelfNG Debian bridge package
      if: matrix.os == 'ubuntu-latest'
      env:
        TASK_SCRATCH_DIR: ${{ runner.temp }}/chaptarrng-deb-bridge-test
      run: bash packaging/scripts/test-build-bookshelfng-deb-bridge.sh

    - name: Test BookshelfNG host migration helper
      if: matrix.os == 'ubuntu-latest'
      run: |
        bash -n scripts/bookshelfng-to-chaptarrng.sh scripts/test-bookshelfng-to-chaptarrng.sh
        bash scripts/test-bookshelfng-to-chaptarrng.sh

    - name: Test BookshelfNG Docker compatibility defaults
      if: matrix.os == 'ubuntu-latest'
      env:
        TMPDIR: ${{ runner.temp }}
      run: bash packaging/scripts/test-docker-bookshelf-compatibility-defaults.sh

    - name: Test legacy environment compatibility for unmapped retry
      if: matrix.os == 'ubuntu-latest'
      env:
        TMPDIR: ${{ runner.temp }}
      run: bash scripts/test-chaptarr-retry-unmapped-env.sh

    - name: Configure .NET install directory
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p -- "$RUNNER_TEMP/dotnet"
        printf 'DOTNET_INSTALL_DIR=%s/dotnet\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"


    - name: Require ImageSharp build license
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      shell: bash
      run: |
        if [[ -z "${SIXLABORS_LICENSE_KEY:-}" ]]; then
          echo "::error::Configure the SIXLABORS_LICENSE_KEY Actions secret to build this repository's direct ImageSharp dependency."
          exit 1
        fi

    - name: Guard (repo) - no merge-conflict markers
      shell: bash
      run: |
        if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
          echo "Merge-conflict markers found in tracked files."
          exit 1
        fi
        python -c "import json; json.load(open('package.json', encoding='utf-8'))"

    - name: Guard (version) - package.json and Directory.Build.props in sync
      shell: bash
      run: python3 build-tools/version_guard.py sync

    - name: Guard (.NET SDK) - workflow and container pins match global.json
      run: python3 scripts/check_dotnet_sdk_pins.py

    - name: Guard (version) - no decreases on main
      if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          COMPARE_REF="origin/main"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              COMPARE_REF="HEAD^"
              echo "No ChaptarrNG release tag exists yet; comparing against the parent commit for the initial fork release."
            else
              echo "No reachable version tag or parent commit is available for monotonic version comparison."
              exit 1
            fi
          fi
        fi

        python3 build-tools/version_guard.py monotonic \
          --compare-ref "$COMPARE_REF" \
          --event-path "$GITHUB_EVENT_PATH"

    - name: Guard (version) - version-only commits stay pure
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail

        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          COMPARE_REF="origin/${BASE_REF}"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              COMPARE_REF="HEAD^"
              echo "No ChaptarrNG release tag exists yet; checking version-only commit hygiene from the parent commit."
            else
              echo "No reachable version tag or parent commit is available for version-only commit hygiene."
              exit 1
            fi
          fi
        fi

        python3 build-tools/version_guard.py commit-hygiene --compare-ref "$COMPARE_REF"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1

    - name: Test Quickstart setup readiness
      run: node --test frontend/src/System/Quickstart/quickstartReadiness.test.cjs

    - name: Install Yarn
      run: npm install --global yarn@1.22.22

    - name: Install frontend dependencies
      run: yarn install --frozen-lockfile

    - name: Verify bundled asset URLs remain same-origin
      run: node --test frontend/src/indexTemplateAssetUrls.test.cjs

    - name: Test Books list both-format filtering
      run: >-
        node --test
        frontend/src/Book/Index/getBookIndexQuery.test.cjs
        frontend/src/Book/Index/BookIndex.test.cjs

    - name: Test book infinite-scroll id deduplication
      run: node --test frontend/src/Store/Reducers/bookInfiniteScrollReducer.test.cjs

    - name: Test BookshelfNG workflow request state and controls
      run: >-
        node --test
        frontend/src/Book/Delete/DeleteBookModalContentConnector.test.cjs
        frontend/src/Book/Details/BookDetailRequests.test.cjs
        frontend/src/Book/Index/Overview/BookIndexOverview.test.cjs
        frontend/src/Book/Index/BookIndexAuthorEditorFormat.test.cjs
        frontend/src/Bookshelf/BookshelfFooter.test.cjs
        frontend/src/Components/Form/ProfileSelectInputConnectors.test.cjs
        frontend/src/Settings/MediaManagement/MediaManagement.test.cjs
        frontend/src/Settings/MediaManagement/RootFolder/RootFolders.test.cjs
        frontend/src/Store/Actions/createBookMonitoringFailureAction.test.cjs
        frontend/src/System/Updates/UpdateChanges.test.cjs

    - name: Test client-side collection equality
      run: node --test frontend/src/Utilities/Object/clientSideCollectionEqual.test.cjs

    - name: Check React Router context
      run: yarn check-react-router-context

    - name: Type-check frontend
      run: yarn typecheck

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.402

    - name: Cache NuGet packages
      # Manual release dispatch can select a branch; do not let those builds write shared cache entries.
      if: runner.os == 'Windows' && github.event_name != 'workflow_dispatch'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('src/NuGet.config', 'src/Directory.Packages.props', 'src/Directory.Build.props', 'src/Directory.Build.targets', 'src/Targets/**/*.targets', 'src/Chaptarr.NoTests.sln', 'src/**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-nuget-
    
    # FFmpeg is intentionally not downloaded in this compile/test workflow.
    # Source builds resolve bundled tools first and then the system PATH; explicit
    # native packaging owns bundled-tool acquisition and validation.

    - name: Restore dependencies
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: |
        dotnet restore src/Chaptarr.NoTests.sln
        dotnet restore src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj
    
    - name: Build
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore

    - name: Build test assembly
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: dotnet build src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release --no-restore -p:UseSharedCompilation=false

    - name: Build tool-enabled M4B test image
      if: matrix.os == 'ubuntu-latest'
      run: docker build -f integration/Dockerfile.m4b-test -t chaptarrng-m4b-test:ci integration

    - name: Test real M4B merge and fallback
      if: matrix.os == 'ubuntu-latest'
      run: |
        docker run --rm --network none \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace/_tests/net10.0 \
          chaptarrng-m4b-test:ci \
          dotnet vstest Chaptarr.Core.Test.dll \
            --TestCaseFilter:"FullyQualifiedName~real_m4b_tool_should_" \
            --Logger:"console;verbosity=normal"

    - name: Configure Chromium cache for direct-download browser tests
      if: runner.os == 'Linux'
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      run: echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

    - name: Install Chromium and system dependencies on Linux
      if: runner.os == 'Linux'
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      shell: bash
      run: |
        set -euo pipefail
        driver=./_tests/net10.0/.playwright
        test -x "$driver/node/linux-x64/node"
        test -f "$driver/package/cli.js"
        PW_LANG_NAME=csharp "$driver/node/linux-x64/node" "$driver/package/cli.js" install --with-deps chromium

    - name: Verify Unraid package sync stays off feature branches
      shell: bash
      run: bash scripts/test-sync-unraid-package.sh

    - name: Verify BookshelfNG legacy distribution contracts
      run: node --test packaging/scripts/test-bookshelf-legacy-channels.mjs

    - name: Verify Linux desktop-candidate staging
      if: runner.os == 'Linux'
      shell: bash
      run: |
        bash -n packaging/scripts/prepare-bookshelf-desktop-candidates.sh \
          packaging/scripts/build-bookshelf-desktop-candidates.sh \
          packaging/scripts/test-prepare-bookshelf-desktop-candidates.sh \
          packaging/scripts/test-build-bookshelf-desktop-candidates.sh
        bash packaging/scripts/test-prepare-bookshelf-desktop-candidates.sh
        bash packaging/scripts/test-build-bookshelf-desktop-candidates.sh

    - name: Test
      env:
        DIRECT_DOWNLOAD_REQUIRE_PLAYWRIGHT: ${{ runner.os == 'Linux' && 'true' || 'false' }}
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      run: dotnet test src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release --no-restore --no-build --verbosity normal

    # CSS Modules generation rewrites tracked declaration files, so build the UI
    # after the tests have finished.
    - name: Build frontend
      run: yarn build
    
    - name: Publish
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: |
        dotnet publish src/NzbDrone.Console/Chaptarr.Console.csproj -c Release -f net10.0 -o ./publish/Chaptarr
        dotnet publish src/NzbDrone.Update/Chaptarr.Update.csproj -c Release -f net10.0 -o ./publish/Chaptarr/Chaptarr.Update

    - name: Include and verify frontend in artifact
      shell: bash
      run: |
        set -euo pipefail
        test -s ./_output/UI/index.html
        mkdir -p ./publish/Chaptarr/UI
        cp -a ./_output/UI/. ./publish/Chaptarr/UI/
        test -s ./publish/Chaptarr/UI/index.html

    - name: Verify optional diagnostics module in artifact
      shell: bash
      run: test -s ./publish/Chaptarr/Chaptarr.Diagnostics.dll

    - name: Build Windows BookshelfNG migration installer
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: ./packaging/scripts/build-windows-bookshelf-migration-installer.ps1 -KeepPayload

    - name: Test Windows migration installer SQLite fingerprint
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: dotnet run --configuration Release --project ./distribution/windows/installer-net-smoke/ChaptarrNG.Installer.Smoke.csproj

    - name: Test Windows BookshelfNG installer upgrade and rollback services
      if: matrix.os == 'windows-latest'
      env:
        CHAPTARR_SERVICE_ROUNDTRIP_CLEANUP_MANIFEST: ${{ runner.temp }}/chaptarr-bookshelf-service-roundtrip-cleanup.json
      shell: pwsh
      run: dotnet run --configuration Release --project ./distribution/windows/installer-net-smoke/ChaptarrNG.Installer.Smoke.csproj -- --windows-service-round-trip

    - name: Clean up Windows BookshelfNG installer round-trip services
      if: always() && matrix.os == 'windows-latest'
      env:
        CHAPTARR_SERVICE_ROUNDTRIP_CLEANUP_MANIFEST: ${{ runner.temp }}/chaptarr-bookshelf-service-roundtrip-cleanup.json
      shell: pwsh
      run: ./distribution/windows/installer-net-smoke/CleanupServiceRoundTrip.ps1 -ManifestPath $env:CHAPTARR_SERVICE_ROUNDTRIP_CLEANUP_MANIFEST

    - name: Remove temporary Windows installer payload
      if: always() && matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $payload = Join-Path $PWD 'distribution/windows/installer-net/Payload/Chaptarr.payload.zip'
        if (Test-Path -LiteralPath $payload) {
          Remove-Item -LiteralPath $payload -Force
        }
        $payloadDirectory = Split-Path -Parent $payload
        if ((Test-Path -LiteralPath $payloadDirectory) -and
            -not (Get-ChildItem -LiteralPath $payloadDirectory -Force | Select-Object -First 1)) {
          Remove-Item -LiteralPath $payloadDirectory -Force
        }

    - name: Test Windows service preserves its selected data directory
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: ./packaging/scripts/test-windows-service-data-path.ps1 -AppDirectory ./publish/Chaptarr
    
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: chaptarrng-${{ matrix.platform }}
        path: ./publish/
        retention-days: 7
        if-no-files-found: error

  postgres-migrations:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-24.04' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chaptarr
          POSTGRES_PASSWORD: chaptarr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chaptarr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Require ImageSharp build license
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      shell: bash
      run: |
        if [[ -z "${SIXLABORS_LICENSE_KEY:-}" ]]; then
          echo "::error::Configure the SIXLABORS_LICENSE_KEY Actions secret to build this repository's direct ImageSharp dependency."
          exit 1
        fi

    - name: Configure user-writable .NET install directory
      shell: bash
      run: |
        set -euo pipefail
        dotnet_dir="$RUNNER_TEMP/dotnet"
        mkdir -p -- "$dotnet_dir"
        printf 'DOTNET_INSTALL_DIR=%s\n' "$dotnet_dir" >> "$GITHUB_ENV"

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.402

    - name: Install PostgreSQL client
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -x /usr/lib/postgresql/16/bin/pg_dump || ! -x /usr/lib/postgresql/16/bin/pg_restore ]]; then
          proxy="${https_proxy:-${HTTPS_PROXY:-${http_proxy:-${HTTP_PROXY:-}}}}"
          apt_options=()
          if [[ -n "$proxy" ]]; then
            apt_options+=(-o "Acquire::http::Proxy=$proxy" -o "Acquire::https::Proxy=$proxy")
          fi
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y postgresql-client-16
        fi
        # Match the service's major version. A newer pg_dump emits settings
        # (such as transaction_timeout) that PostgreSQL 16 cannot restore.
        /usr/lib/postgresql/16/bin/pg_dump --version
        /usr/lib/postgresql/16/bin/pg_restore --version
        echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

    - name: Pin dump tools to the PostgreSQL service version
      shell: bash
      run: |
        set -euo pipefail
        client_dir="$RUNNER_TEMP/postgres16-client-bin"
        mkdir -p -- "$client_dir"
        cat > "$client_dir/postgres16-tool" <<'WRAPPER'
        #!/usr/bin/env bash
        set -euo pipefail
        tool="${0##*/}"
        docker_args=(run --rm --network host --user "$(id -u):$(id -g)" --volume "${RUNNER_TEMP}:${RUNNER_TEMP}")
        while IFS= read -r name; do
          docker_args+=(--env "$name")
        done < <(compgen -e | grep '^PG' || true)
        docker "${docker_args[@]}" postgres:16 "$tool" "$@"
        WRAPPER
        chmod 0755 "$client_dir/postgres16-tool"
        ln -s postgres16-tool "$client_dir/pg_dump"
        ln -s postgres16-tool "$client_dir/pg_restore"
        echo "$client_dir" >> "$GITHUB_PATH"

    - name: Create databases
      shell: bash
      env:
        PGPASSWORD: chaptarr
      run: |
        set -euo pipefail
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-main";'
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-log";'
        psql -h localhost -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-cache";'

    - name: Restore dependencies
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: |
        dotnet restore src/Chaptarr.NoTests.sln
        dotnet restore src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj

    - name: Build (migrations smoke)
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: |
        dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore
        dotnet build src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release --no-restore -p:UseSharedCompilation=false

    - name: Smoke - migrate up on fresh PostgreSQL
      env:
        TMPDIR: ${{ runner.temp }}
        CHAPTARRNG_POSTGRES_SMOKE_DIR: ${{ runner.temp }}/chaptarr-postgres-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        Chaptarr__Postgres__Host: localhost
        Chaptarr__Postgres__Port: "5432"
        Chaptarr__Postgres__User: chaptarr
        Chaptarr__Postgres__Password: chaptarr
        Chaptarr__Postgres__MainDb: chaptarr-main
        Chaptarr__Postgres__LogDb: chaptarr-log
        Chaptarr__Postgres__CacheDb: chaptarr-cache
        CHAPTARRNG_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=chaptarr-main;Username=chaptarr;Password=chaptarr;Pooling=false;Timeout=5;Command Timeout=300
        Chaptarr__Server__BindAddress: 127.0.0.1
        Chaptarr__Server__Port: "8789"
      run: bash scripts/test-postgres-migrations-smoke.sh

    - name: Upload PostgreSQL smoke logs
      id: postgres-smoke-logs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chaptarr-postgres-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/chaptarr-postgres-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 3
        if-no-files-found: ignore

    - name: Remove local PostgreSQL smoke logs
      if: always() && steps.postgres-smoke-logs.outcome != 'failure'
      shell: bash
      run: rm -rf -- "${{ runner.temp }}/chaptarr-postgres-smoke-${{ github.run_id }}-${{ github.run_attempt }}"

  docker-compatibility-build:
    name: Docker (${{ matrix.target }})
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    env:
      BUILDKIT_EGRESS_PROXY: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'http://10.0.2.100:3128' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: chaptarrng-standard
            cache-scope: standard
          - target: bookshelf-softcover
            cache-scope: bookshelf-softcover
          - target: bookshelf-hardcover
            cache-scope: bookshelf-hardcover
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Check whether the Six Labors build secret is available
      id: license
      env:
        LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        EVENT_NAME: ${{ github.event_name }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "$LICENSE_KEY" ]]; then
          echo 'configured=true' >> "$GITHUB_OUTPUT"
        elif [[ "$EVENT_NAME" == 'pull_request' ]]; then
          echo 'configured=false' >> "$GITHUB_OUTPUT"
          echo 'Docker image builds are skipped for pull requests without the private image-build license.' >> "$GITHUB_STEP_SUMMARY"
        else
          echo '::error::SIXLABORS_LICENSE_KEY is required for Docker image validation outside pull requests.'
          exit 1
        fi

    - name: Set up QEMU for target-platform runtime steps
      if: steps.license.outputs.configured == 'true'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm,arm64

    - name: Set up Docker Buildx
      if: steps.license.outputs.configured == 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        # The isolated BuildKit daemon needs the runner's trust roots too.
        buildkitd-config-inline: |
          [registry."docker.io"]
            ca = ["/etc/ssl/certs/ca-certificates.crt"]
        driver-opts: |
          env.HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
          env.HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
          env.http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
          env.https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
          env.SSL_CERT_FILE=/etc/buildkit/certs/docker.io/ca-certificates.crt

    - name: Build image for all published architectures without pushing
      if: steps.license.outputs.configured == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: ./Dockerfile.cross
        target: ${{ matrix.target }}
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: false
        build-args: |
          HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
          HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
          http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
          https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
          NO_PROXY=localhost,127.0.0.1
          no_proxy=localhost,127.0.0.1
        cache-from: type=gha,scope=bookshelfng-${{ matrix.cache-scope }}
        cache-to: type=gha,scope=bookshelfng-${{ matrix.cache-scope }},mode=max
        secrets: |
          SIXLABORS_LICENSE_KEY=${{ secrets.SIXLABORS_LICENSE_KEY }}

