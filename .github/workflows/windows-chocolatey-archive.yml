# ng-runner-policy: trusted-hosted-or-private-jit-v1
name: Windows Chocolatey archive acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-chocolatey-archive.yml'
      - 'global.json'
      - 'packaging/chocolatey/**'
      - 'packaging/legacy/chocolatey/**'
      - 'packaging/scripts/build-standalone.sh'
      - 'packaging/scripts/install-update-verifier.py'
      - 'packaging/scripts/test-chocolatey-bookshelfng-handoff.ps1'
      - 'packaging/scripts/test-windows-service-data-path.ps1'
      - 'security/gh-verifier-assets.json'
      - 'src/Directory.Packages.props'
      - 'src/**/packages.lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    name: Build and check the Windows release ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.archive.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.4
          check-latest: false
          cache: false
      - name: Build the web UI
        run: |
          npm install --global npm@12.2.2 yarn@1.22.22
          yarn install --frozen-lockfile
          yarn build
      - name: Build the exact standalone payload used by Chocolatey
        id: archive
        run: |
          set -euo pipefail
          assembly_version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("src/Directory.Build.props").findtext(".//AssemblyVersion"))')
          version=${assembly_version%.0}
          bash packaging/scripts/build-standalone.sh "$version" win-x64 "$RUNNER_TEMP/windows-archive"
          cd "$RUNNER_TEMP/windows-archive"
          archive="ChaptarrNG-${version}-win-x64.zip"
          unzip -tq "$archive"
          sha256sum --check "$archive.sha256"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-chocolatey-archive
          path: ${{ runner.temp }}/windows-archive/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  installed:
    needs: archive
    name: Install and migrate the Windows release ZIP
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.archive.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-chocolatey-archive
          path: ${{ runner.temp }}/windows-archive
      - name: Test fresh service install and the Chocolatey BookshelfNG upgrade
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "windows-archive/ChaptarrNG-$env:VERSION-win-x64.zip"
          $checksum = ((Get-Content -LiteralPath "$archive.sha256" -Raw) -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $checksum) {
            throw 'The Windows acceptance archive checksum does not match its build output.'
          }
          $appDirectory = Join-Path $env:RUNNER_TEMP 'windows-archive/expanded'
          Expand-Archive -LiteralPath $archive -DestinationPath $appDirectory
          ./packaging/scripts/test-windows-service-data-path.ps1 -AppDirectory $appDirectory
          ./packaging/scripts/test-chocolatey-bookshelfng-handoff.ps1 -Version $env:VERSION -ArchivePath $archive
