name: Security audit status
on:
  workflow_run:
    workflows: [Security gate]
    types: [completed]
permissions:
  contents: read
jobs:
  record-pr-status:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Record the read-only scan result on the exact PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          state=failure
          if [[ "$RUN_CONCLUSION" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f "state=$state" -f context='Security audit' \
            -f "description=Security scan: $RUN_CONCLUSION" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
