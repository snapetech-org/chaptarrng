# ng-runner-policy: trusted-hosted-or-private-jit-v1
name: Native audit acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'packaging/**'
      - '!packaging/scripts/test-*.mjs'
      - '!packaging/scripts/test_*.py'
      - 'scripts/**'
      - 'package.json'
      - 'yarn.lock'
      - 'global.json'
      - 'Directory.*'
      - '.config/**'
      - 'security/gh-verifier-assets.json'
      - '.github/workflows/native-audit-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-audit-acceptance-${{ github.ref }}
  # Native runs are expensive; retain a running candidate while newer main work
  # waits. Its exact source/hash evidence remains valid when app inputs match.
  cancel-in-progress: false
jobs:
  frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Build locked frontend
        run: |
          npm install --global npm@12.2.2 yarn@1.22.22
          yarn install --frozen-lockfile
          yarn build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-audit-ui
          path: _output/UI/**
          retention-days: 7
          if-no-files-found: error
  archives:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64, win-x64, win-x86]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.4
          check-latest: false
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-audit-ui
          path: _output/UI
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Build exact candidate archive
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          bash packaging/scripts/build-standalone.sh 0.0.0 "$RID" "$RUNNER_TEMP/native-audit-candidate"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/native-audit-candidate/source-commit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-audit-${{ matrix.rid }}
          path: ${{ runner.temp }}/native-audit-candidate/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  installed:
    needs: archives
    name: Installed ${{ matrix.rid }} audit recovery
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            predecessor_sha256: a490b90bfcc608a40844d5c3ce09f3cc95b767e3fbea93c71401b33326ab30f2
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            predecessor_sha256: 1aeca17ed8cd8ed862e7d88ef334fda825fe796832cbfbf7e66e8d102fee4d03
          - rid: linux-musl-x64
            runner: ubuntu-24.04
            predecessor_sha256: f0d8983f72663fcb5ccbeb4758bc4adcb1e9d5d19ed57c62e91a0409b3500bba
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
            predecessor_sha256: 95968365c66772193c53264831dd1ef7ff6954ebdbd26e423b1cd777ddf3caad
          - rid: osx-x64
            runner: macos-15-intel
            predecessor_sha256: 4f660a1367e28c01660c2e082c4f1778f652cca34affc0dba55d3f47ef67f747
          - rid: osx-arm64
            runner: macos-15
            predecessor_sha256: d964bb1146b6c9e313758a967815f53f8d9aa45314bc30cfa55e96bb299433ce
          - rid: win-x64
            runner: windows-2022
            predecessor_sha256: d31cc96dddffad5cc9b20e68f55862cb7107033aedae733f185aa73f50a6d67d
          - rid: win-x86
            runner: windows-2022
            predecessor_sha256: b80df3211eecb208c54645a9fda17019a5322764a91b2abb5d177cc67beb7be8
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      PREDECESSOR_SHA256: ${{ matrix.predecessor_sha256 }}
      HARDCOVER: 'false'
      HARDCOVER_NATIVE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-audit-${{ matrix.rid }}
          path: ${{ runner.temp }}/native-audit-candidate
      - name: Verify retained candidate and pinned predecessor
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/native-audit-candidate/source-commit.txt")" = "$GITHUB_SHA"
          extension=tar.gz
          [[ "$RID" != win-* ]] || extension=zip
          candidate="ChaptarrNG-0.0.0-${RID}.$extension"
          predecessor="BookshelfNG-v0.4.21.76-${RID}.$extension"
          mkdir -p "$RUNNER_TEMP/native-audit-predecessor"
          curl --fail --location --retry 3 --retry-all-errors --max-time 300 \
            "https://github.com/snapetech-org/bookshelfng/releases/download/v0.4.21.76/$predecessor" \
            --output "$RUNNER_TEMP/native-audit-predecessor/$predecessor"
          checksum=(shasum -a 256)
          if command -v sha256sum >/dev/null; then checksum=(sha256sum); fi
          printf '%s  %s\n' "$PREDECESSOR_SHA256" "$RUNNER_TEMP/native-audit-predecessor/$predecessor" | "${checksum[@]}" --check -
          (cd "$RUNNER_TEMP/native-audit-candidate" && "${checksum[@]}" --check "$candidate.sha256")
      - name: Exercise installed migration and forced rollback
        run: bash scripts/test-native-audit-handoff.sh
      - name: Retain installed recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-audit-evidence-${{ matrix.rid }}
          path: ${{ runner.temp }}/native-audit-handoff/
          retention-days: 14
          if-no-files-found: warn
