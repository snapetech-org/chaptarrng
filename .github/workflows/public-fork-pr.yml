name: ChaptarrNG fork PR validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: public-fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  validate:
    name: Run disposable fork validation
    if: >-
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/chaptarrng' &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
    uses: snapetech-org/chaptarrng/.github/workflows/fork-safe-validation.yml@64e83eb6e1734f90e8429affc8fbb76abd6d9564

