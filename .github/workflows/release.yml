# ng-runner-policy: hosted-first-v1
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-preflight"]}}', github.run_id)) || 'ubuntu-latest' }}
    outputs:
      release_requested: ${{ steps.release-request.outputs.release_requested }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        persist-credentials: false

    - name: Validate release tag and source
      id: release-request
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        tag="$GITHUB_REF_NAME"
        if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "Expected a stable v<semver> release tag, found $tag." >&2
          exit 1
        fi
        version="$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
        if [[ "$tag" != "v$version" ]]; then
          echo "Release tag $tag does not match package.json version $version." >&2
          exit 1
        fi
        python3 build-tools/version_guard.py sync
        python3 build-tools/version_guard.py release-tag --tag "$tag"
        git fetch --no-tags origin main
        release_sha="$(git rev-parse "${tag}^{commit}")"
        if ! git merge-base --is-ancestor "$release_sha" origin/main; then
          echo "Release tag $tag must point to a commit on origin/main." >&2
          exit 1
        fi

        releases_json="$RUNNER_TEMP/published-releases.json"
        gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt > "$releases_json"
        latest_tag="$(jq -r '
          [.[] | select(.isDraft == false and .isPrerelease == false and
            (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))]
          | sort_by(.publishedAt)
          | last
          | .tagName // empty
        ' "$releases_json")"
        latest_version="${latest_tag#v}"
        is_newer="$(python3 -c 'import sys; current=tuple(map(int, sys.argv[1].split("."))); latest=tuple(map(int, sys.argv[2].split("."))) if sys.argv[2] else (); print(str(current > latest).lower())' "$version" "$latest_version")"

        if [[ "$is_newer" != true ]]; then
          echo "Version $version is not newer than the latest published stable release ${latest_tag:-<none>}." >&2
          exit 1
        fi

        echo "Release tag $tag is valid and newer than ${latest_tag:-<none>}."
        echo 'release_requested=true' >> "$GITHUB_OUTPUT"

    - name: Require retirement release readiness
      if: steps.release-request.outputs.release_requested == 'true'
      env:
        CHAPTARRNG_RELEASE_READY: ${{ vars.CHAPTARRNG_RELEASE_READY }}
        BOOKSHELFNG_RELEASE_READY: ${{ vars.BOOKSHELFNG_RELEASE_READY }}
      run: ./packaging/scripts/require-release-readiness.sh

    - name: Validate Discord release destination before publishing
      if: steps.release-request.outputs.release_requested == 'true'
      env:
        DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      run: bash packaging/scripts/validate-release-publisher-config.sh discord

  validate:
    if: needs.preflight.outputs.release_requested == 'true'
    needs: preflight
    uses: ./.github/workflows/build.yml
    permissions:
      actions: read
      contents: read

  release:
    needs: validate
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-release"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.changelog.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      release_body: ${{ steps.changelog.outputs.release_body }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Install git-cliff
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: git-cliff

    - name: Resolve source head
      id: source
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Guard - versions in sync
      run: python3 build-tools/version_guard.py sync

    - name: Resolve tag
      id: tag
      shell: bash
      run: |
        set -euo pipefail
        VERSION="$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
        [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
        echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Guard - tag matches versions
      run: python3 build-tools/version_guard.py release-tag --tag "${{ steps.tag.outputs.tag }}"

    - name: Guard - release tag still points to validated source
      env:
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail
        TAG_SHA="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
        if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
          echo "Release tag $GITHUB_REF_NAME resolves to $TAG_SHA, expected $SOURCE_SHA."
          exit 1
        fi
        git fetch --no-tags origin main
        if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
          echo "Release tag $GITHUB_REF_NAME no longer points to an origin/main commit."
          exit 1
        fi

    - name: Generate release changelog
      id: changelog
      env:
        TAG: ${{ steps.tag.outputs.tag }}
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPO: ${{ github.repository }}
      shell: bash
      run: |
        set -euo pipefail

        releases_json="$RUNNER_TEMP/published-releases.json"
        gh release list --limit 100 --json tagName,isDraft,isPrerelease,publishedAt > "$releases_json"
        PREVIOUS_TAG="$(jq -r --arg current "$TAG" '
          [.[] | select(.isDraft == false and .isPrerelease == false and .tagName != $current and
            (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))]
          | sort_by(.publishedAt)
          | last
          | .tagName // empty
        ' "$releases_json")"
        if [[ -z "$PREVIOUS_TAG" ]]; then
          echo "No previously published stable release was found."
          exit 1
        fi

        git merge-base --is-ancestor "$PREVIOUS_TAG" "$SOURCE_SHA" || {
          echo "Previous release $PREVIOUS_TAG is not an ancestor of $SOURCE_SHA."
          exit 1
        }

        current_changelog="$RUNNER_TEMP/chaptarrng-current-changelog.md"
        git-cliff --config .github/cliff.toml --tag "$TAG" "$PREVIOUS_TAG..$SOURCE_SHA" \
          --output "$current_changelog"
        node scripts/assemble-release-notes.mjs \
          --previous-tag "$PREVIOUS_TAG" \
          --head "$SOURCE_SHA" \
          --changelog "$current_changelog" \
          --output "$current_changelog"
        grep -Eq '^## \[?[0-9]+\.[0-9]+\.[0-9]+' "$current_changelog" || {
          echo "Generated changelog is missing its release heading."
          exit 1
        }

        echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
        delimiter="release_body_$GITHUB_RUN_ID"
        {
          echo "release_body<<$delimiter"
          cat "$current_changelog"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: Verify release tag
      env:
        TAG: ${{ steps.tag.outputs.tag }}
        RELEASE_SHA: ${{ steps.changelog.outputs.sha }}
      shell: bash
      run: |
        set -euo pipefail
        TAG_SHA="$(git rev-parse "${TAG}^{commit}")"
        if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
          echo "Release tag $TAG resolves to $TAG_SHA, expected $RELEASE_SHA." >&2
          exit 1
        fi

    - name: Create draft release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.tag.outputs.tag }}
        RELEASE_BODY: ${{ steps.changelog.outputs.release_body }}
      shell: bash
      run: |
        set -euo pipefail
        notes="$RUNNER_TEMP/chaptarrng-release-notes.md"
        printf '%s\n' "$RELEASE_BODY" > "$notes"

        if gh release view "$TAG" >/dev/null 2>&1; then
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "$TAG" \
              --title "ChaptarrNG $TAG" \
              --notes-file "$notes" \
              --draft=true \
              --prerelease=false
          else
            echo "Release $TAG is already published; leaving it published."
          fi
        else
          gh release create "$TAG" \
            --title "ChaptarrNG $TAG" \
            --notes-file "$notes" \
            --draft \
            --verify-tag
        fi

  # Images publish here and nowhere else, so merging PRs never ships an update.
  docker:
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      sha: ${{ needs.release.outputs.sha }}
      branch: main
      legacy_bridge_enabled: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}

  dispatch-legacy-ghcr:
    name: Dispatch personal-account BookshelfNG GHCR bridge
    needs: [release, docker, publish-release]
    if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-dispatch-legacy-ghcr"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Create scoped bridge-repository token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.CHAPTARRNG_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.CHAPTARRNG_AUTOMATION_APP_PRIVATE_KEY }}
          owner: snapetech
          repositories: bookshelfng-ghcr-release-bridge
          permission-contents: write
      - name: Dispatch verified image and migration-flavor digests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
          SOURCE_SHA: ${{ needs.release.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
          BOOKSHELF_SOFTCOVER_DIGEST: ${{ needs.docker.outputs.bookshelf_softcover_digest }}
          BOOKSHELF_HARDCOVER_DIGEST: ${{ needs.docker.outputs.bookshelf_hardcover_digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: bash packaging/scripts/dispatch-ghcr-release-bridge.sh

  platform-runtime-packs:
    name: Build Linux x86 and FreeBSD .NET 10 runtime packs
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: |
          10.0.110
          10.0.111
          10.0.402

    - name: Build pinned extra-platform runtime packs
      env:
        DOTNETVERSION: 10.0.402
        DOTNET_ROOT: /usr/share/dotnet
        PLATFORM_RUNTIME_WORK_DIR: ${{ runner.temp }}/chaptarrng-platform-runtime-work
        PLATFORM_RUNTIME_PACKS_OUTPUT: ${{ runner.temp }}/chaptarrng-platform-runtime-packs
      run: bash packaging/scripts/build-extra-platform-runtime-packs.sh

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chaptarrng-platform-runtime-packs
        path: ${{ runner.temp }}/chaptarrng-platform-runtime-packs/**
        retention-days: 1
        if-no-files-found: error

  standalone-assets:
    name: Build ${{ matrix.rid }} standalone release asset
    needs: [release, platform-runtime-packs]
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-{1}-standalone-assets"]}}', github.run_id, strategy.job-index)) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64, win-x64, win-x86, linux-x86, freebsd-x64]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Build frontend
      run: |
        npm install --global yarn@1.22.22
        yarn install --frozen-lockfile
        yarn build

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.0.402

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ matrix.rid == 'linux-x86' || matrix.rid == 'freebsd-x64' }}
      with:
        name: chaptarrng-platform-runtime-packs
        path: ${{ runner.temp }}/platform-runtime-packs

    - name: Build standalone application archive
      env:
        CUSTOM_RUNTIME_PACKS_DIR: ${{ runner.temp }}/platform-runtime-packs/packages
        DOTNET_ROOT: /usr/share/dotnet
        DOTNETVERSION: 10.0.402
        VERSION: ${{ needs.release.outputs.version }}
        RID: ${{ matrix.rid }}
      run: bash packaging/scripts/build-standalone.sh "$VERSION" "$RID" "$RUNNER_TEMP/release-assets"

    - name: Verify archive and checksum sidecar
      env:
        VERSION: ${{ needs.release.outputs.version }}
        RID: ${{ matrix.rid }}
      run: |
        set -euo pipefail
        if [[ "$RID" == win-* ]]; then
          asset="ChaptarrNG-${VERSION}-${RID}.zip"
          unzip -t "$RUNNER_TEMP/release-assets/$asset" >/dev/null
        else
          asset="ChaptarrNG-${VERSION}-${RID}.tar.gz"
          tar -tzf "$RUNNER_TEMP/release-assets/$asset" >/dev/null
          if [[ "$RID" == linux-* || "$RID" == osx-* ]]; then
            tar -tzf "$RUNNER_TEMP/release-assets/$asset" \
              | grep -Fx 'ChaptarrNG/scripts/bookshelfng-to-chaptarrng.sh' >/dev/null
          fi
        fi
        (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$asset.sha256")

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chaptarrng-standalone-${{ matrix.rid }}
        path: ${{ runner.temp }}/release-assets/*
        retention-days: 1
        if-no-files-found: error

  rpm-source:
    name: Build verified new and legacy COPR source RPMs
    needs: [release, standalone-assets]
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-rpm-source"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: chaptarrng-standalone-linux-x64
        path: ${{ runner.temp }}/linux-x64

    - name: Install RPM tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends rpm

    - name: Build both package identities from the same ChaptarrNG release asset
      env:
        VERSION: ${{ needs.release.outputs.version }}
      run: |
        set -euo pipefail
        asset="ChaptarrNG-${VERSION}-linux-x64.tar.gz"
        VERSION="$VERSION" \
          ARCHIVE_PATH="$RUNNER_TEMP/linux-x64/$asset" \
          OUTPUT_DIR="$RUNNER_TEMP/rpm-source-output" \
          bash packaging/scripts/build-rpm-sources.sh

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: chaptarrng-rpm-source
        path: |
          ${{ runner.temp }}/rpm-source-output/*.src.rpm
          ${{ runner.temp }}/rpm-source-output/*.src.rpm.sha256
        retention-days: 1
        if-no-files-found: error

  publish-release:
    needs: [release, docker, standalone-assets, rpm-source]
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-publish-release"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: chaptarrng-standalone-*
        merge-multiple: true
        path: ${{ runner.temp }}/release-assets

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: chaptarrng-rpm-source
        path: ${{ runner.temp }}/release-assets

    - name: Build the gated BookshelfNG Debian package asset
      if: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      env:
        VERSION: ${{ needs.release.outputs.version }}
        ARCHIVE_PATH: ${{ runner.temp }}/release-assets/ChaptarrNG-${{ needs.release.outputs.version }}-linux-x64.tar.gz
        OUTPUT_DIR: ${{ runner.temp }}/bookshelfng-deb-bridge
      run: |
        set -euo pipefail
        archive="$(basename "$ARCHIVE_PATH")"
        (cd "$(dirname "$ARCHIVE_PATH")" && sha256sum --check "$archive.sha256")
        bash packaging/scripts/build-bookshelfng-deb-bridge.sh
        cp "$OUTPUT_DIR"/bookshelfng_*.deb "$RUNNER_TEMP/release-assets/"
        cp "$OUTPUT_DIR"/bookshelfng_*.deb.sha256 "$RUNNER_TEMP/release-assets/"

    - name: Verify and attach release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.release.outputs.tag }}
        VERSION: ${{ needs.release.outputs.version }}
        LEGACY_BRIDGE_ENABLED: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
      run: |
        set -euo pipefail
        release_state="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
        if [[ "$release_state" != "true" ]]; then
          echo "Refusing to mutate the published release $TAG."
          exit 1
        fi
        for rid in linux-x64 linux-arm64; do
          asset="ChaptarrNG-${VERSION}-${rid}.tar.gz"
          test -s "$RUNNER_TEMP/release-assets/$asset"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$asset.sha256")
        done
        asset="ChaptarrNG-${VERSION}-win-x64.zip"
        test -s "$RUNNER_TEMP/release-assets/$asset"
        (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$asset.sha256")
        srpm="chaptarrng-${VERSION}-1.src.rpm"
        test -s "$RUNNER_TEMP/release-assets/$srpm"
        (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$srpm.sha256")
        legacy_srpm="bookshelfng-${VERSION}-1.src.rpm"
        test -s "$RUNNER_TEMP/release-assets/$legacy_srpm"
        (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$legacy_srpm.sha256")
        if [[ "$LEGACY_BRIDGE_ENABLED" == true ]]; then
          legacy_deb="bookshelfng_${VERSION}-1_amd64.deb"
          test -s "$RUNNER_TEMP/release-assets/$legacy_deb"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum --check "$legacy_deb.sha256")
        fi
        mapfile -d '' release_files < <(find "$RUNNER_TEMP/release-assets" -mindepth 1 -maxdepth 1 -type f -print0)
        ((${#release_files[@]} > 0))
        gh release upload "$TAG" "${release_files[@]}" --clobber

    - name: Publish verified draft
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.release.outputs.tag }}
        RELEASE_BODY: ${{ needs.release.outputs.release_body }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
          echo "Stable releases must be published from the matching v<semver> tag."
          exit 1
        fi
        notes="$RUNNER_TEMP/chaptarrng-release-notes.md"
        printf '%s\n' "$RELEASE_BODY" > "$notes"
        gh release edit "$TAG" \
          --notes-file "$notes" \
          --draft=false \
          --prerelease=false \
          --latest

  publish-packages:
    needs: [release, docker, publish-release]
    uses: ./.github/workflows/release-distribution.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
      legacy_bridge_enabled: ${{ vars.CHAPTARRNG_MIGRATION_BRIDGE_ENABLED == 'true' && vars.CHAPTARRNG_RELEASE_READY == 'true' && vars.BOOKSHELFNG_RELEASE_READY == 'true' }}
    secrets:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
      BOOKSHELFNG_COPR_WEBHOOK_URL: ${{ secrets.BOOKSHELFNG_COPR_WEBHOOK_URL }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  announce-discord:
    name: Announce release to Discord
    needs: [release, docker, publish-release]
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-chaptarrng","ng-main-run-{0}","gha-{0}-announce-discord"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      ANNOUNCEMENT_TITLE: ChaptarrNG ${{ needs.release.outputs.tag }} release notes
      ANNOUNCEMENT_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}
      ANNOUNCEMENT_BODY: ${{ needs.release.outputs.release_body }}
      ANNOUNCEMENT_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ANNOUNCEMENT_IMAGE_REF: ghcr.io/snapetech-org/chaptarrng:${{ needs.release.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.sha }}
        persist-credentials: false

    - name: Verify checked-out release source
      env:
        EXPECTED_RELEASE_SHA: ${{ needs.release.outputs.sha }}
      run: bash packaging/scripts/verify-release-source-sha.sh

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Check Discord destination
      run: |
        if [[ -z "$DISCORD_RELEASE_WEBHOOK" ]]; then
          echo "::error::Add the DISCORD_RELEASE_WEBHOOK repository secret using the same webhook configured for SeerrNG."
          exit 1
        fi

    - name: Send Discord announcement
      run: node scripts/post-discord-announcement.mjs
